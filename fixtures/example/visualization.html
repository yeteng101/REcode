<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Reverse Analysis</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #e9eef3;
      --text: #18202a;
      --muted: #66727f;
      --border: #d7dee6;
      --accent: #2f6fed;
      --accent-soft: #dfe9ff;
      --green: #1f8a5b;
      --red: #c23b46;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10151c;
        --surface: #171d26;
        --surface-2: #202936;
        --text: #e8edf3;
        --muted: #a3adba;
        --border: #303b49;
        --accent: #6f9dff;
        --accent-soft: #233a62;
        --green: #55b98a;
        --red: #e5727c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 22px 28px 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    main {
      padding: 18px 28px 30px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      min-height: 68px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }
    .stat-value {
      margin-top: 7px;
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tab {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 600;
    }
    .graph-shell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      min-height: 330px;
    }
    svg { display: block; width: 100%; height: auto; }
    .module-node {
      cursor: pointer;
      stroke: var(--accent);
      stroke-width: 1.5;
      fill: var(--surface-2);
    }
    .module-node.selected {
      fill: var(--accent-soft);
      stroke-width: 3;
    }
    .module-label {
      fill: var(--text);
      font-size: 12px;
      text-anchor: middle;
    }
    .module-edge {
      stroke: var(--muted);
      stroke-opacity: 0.42;
      fill: none;
    }
    .overview-detail {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .module-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }
    .module-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .module-name {
      margin-bottom: 7px;
      font-weight: 600;
    }
    .module-bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }
    .module-bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .module-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }
    .toolbar label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      color: var(--muted);
      font-size: 12px;
    }
    input {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 500;
    }
    td.code {
      max-width: 380px;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .call-count {
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 12px;
    }
    .finding-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .finding-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px;
    }
    .finding-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .path-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .path-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    @media (max-width: 600px) {
      header, main { padding-left: 14px; padding-right: 14px; }
      .toolbar { display: block; }
      th:nth-child(2), td:nth-child(2) { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="viz-title">Code Reverse Analysis</h1>
    <div class="meta" id="viz-meta"></div>
  </header>
  <main>
    <section class="stats" id="viz-stats"></section>
    <nav class="tabs" aria-label="Views">
      <button class="tab active" type="button" data-tab="overview">Overview</button>
      <button class="tab" type="button" data-tab="modules">Modules</button>
      <button class="tab" type="button" data-tab="calls">Calls</button>
      <button class="tab" type="button" data-tab="findings">Findings</button>
    </nav>
    <section class="panel active" id="panel-overview">
      <h2 class="section-title">Module Graph</h2>
      <div class="graph-shell" id="module-graph"></div>
      <div class="overview-detail" id="overview-detail"></div>
    </section>
    <section class="panel" id="panel-modules">
      <h2 class="section-title">Modules</h2>
      <div class="module-list" id="module-list"></div>
    </section>
    <section class="panel" id="panel-calls">
      <h2 class="section-title">Calls</h2>
      <div class="toolbar">
        <label>Symbol / File
          <input id="call-filter" type="search" autocomplete="off">
        </label>
      </div>
      <div class="call-count" id="call-count"></div>
      <table>
        <thead>
          <tr><th>Source</th><th>Module</th><th>Target</th><th>Kind</th><th>Location</th><th>Code</th></tr>
        </thead>
        <tbody id="call-rows"></tbody>
      </table>
    </section>
    <section class="panel" id="panel-findings">
      <h2 class="section-title">Findings</h2>
      <div class="finding-grid" id="finding-grid"></div>
    </section>
  </main>
  <script id="viz-data" type="application/json">{"run_id":"generic-analysis","repository":"example/alpha-beta","commit":"0123456789abcdef0123456789abcdef01234567","build_profile":"generic","metrics":{"nodes":6,"edges":5,"evidence":5,"external":2,"coverage":0.8,"resource_items":1,"sync_items":1},"node_kinds":{"function":3,"external_function":2,"callback":1},"edge_kinds":{"direct_call":4,"callback_edge":1},"modules":[{"id":"external","name":"external","value":2},{"id":"io","name":"io","value":2},{"id":"core","name":"core","value":1},{"id":"project","name":"project","value":1}],"module_edges":[{"source":"io","target":"external","value":2},{"source":"core","target":"io","value":1},{"source":"io","target":"project","value":1}],"calls":[{"id":"edge-alpha-beta","source":"alpha","target":"beta","source_component":"core","target_component":"io","kind":"direct_call","file":"project/alpha.c","line":12,"snippet":"beta();","confidence":1.0},{"id":"edge-beta-read","source":"beta","target":"read_data","source_component":"io","target_component":"io","kind":"direct_call","file":"project/io/beta.c","line":22,"snippet":"read_data(path);","confidence":1.0},{"id":"edge-read-close","source":"read_data","target":"close","source_component":"io","target_component":"external","kind":"direct_call","file":"project/io/read_data.c","line":36,"snippet":"close(fd);","confidence":1.0},{"id":"edge-read-callback","source":"read_data","target":"on_ready","source_component":"io","target_component":"project","kind":"callback_edge","file":"project/io/read_data.c","line":38,"snippet":"ctx->cb(ctx);","confidence":0.8},{"id":"edge-read-open","source":"read_data","target":"open","source_component":"io","target_component":"external","kind":"direct_call","file":"project/io/read_data.c","line":32,"snippet":"fd = open(path, O_RDONLY);","confidence":1.0}],"key_chains":[{"id":"path-alpha-read","summary":"alpha → beta → read_data","termination_reason":"leaf","confidence":1.0},{"id":"path-read-callback","summary":"read_data → on_ready","termination_reason":"callback","confidence":0.8}],"resource_flow":{"status":"partial","types":{"file_descriptor":1}},"sync_relations":{"status":"succeeded","types":{"mutex_lock":1}},"analysis":"# Generic Analysis\n\nalpha 调用 beta，beta 调用 read_data。read_data 打开输入文件、读取内容、关闭文件，\n最后通过 on_ready 回调通知调用方。\n","summary":"alpha 通过 beta 进入 io 模块读取数据，并在完成后调用 on_ready 回调。"}</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById("viz-data").textContent);
      const byId = (id) => document.getElementById(id);

      byId("viz-title").textContent = data.repository || data.run_id || "Code Reverse Analysis";
      const meta = [data.repository, data.commit, data.build_profile, data.run_id]
        .filter(Boolean).join(" · ");
      byId("viz-meta").textContent = meta;

      const metrics = [
        ["Nodes", data.metrics.nodes],
        ["Edges", data.metrics.edges],
        ["External", data.metrics.external],
        ["Evidence", data.metrics.evidence],
        ["Resource", data.metrics.resource_items],
        ["Sync", data.metrics.sync_items],
        ["Coverage", data.metrics.coverage == null ? "N/A" : `${(data.metrics.coverage * 100).toFixed(1)}%`]
      ];
      byId("viz-stats").innerHTML = metrics.map(([label, value]) =>
        `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`
      ).join("");

      const tabs = [...document.querySelectorAll(".tab")];
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((item) => item.classList.remove("active"));
          document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
          tab.classList.add("active");
          byId(`panel-${tab.dataset.tab}`).classList.add("active");
        });
      });

      function renderModules() {
        const max = Math.max(1, ...data.modules.map((item) => item.value));
        byId("module-list").innerHTML = data.modules.map((item) =>
          `<div class="module-card">
             <div class="module-name">${item.name}</div>
             <div class="module-bar"><span style="width:${(item.value / max) * 100}%"></span></div>
             <div class="module-meta">${item.value} nodes</div>
           </div>`
        ).join("");
      }

      function renderModuleGraph() {
        const container = byId("module-graph");
        const width = 760;
        const height = 430;
        const cx = width / 2;
        const cy = height / 2;
        const rx = Math.min(320, width / 2 - 80);
        const ry = Math.min(165, height / 2 - 60);
        const maxValue = Math.max(1, ...data.modules.map((item) => item.value));
        const nodes = data.modules.slice(0, 8);
        const byName = Object.fromEntries(nodes.map((item) => [item.id, item]));
        const nodePositions = nodes.map((item, index) => {
          const angle = -Math.PI / 2 + (index / nodes.length) * Math.PI * 2;
          return {
            x: cx + Math.cos(angle) * rx,
            y: cy + Math.sin(angle) * ry
          };
        });
        const edges = data.module_edges
          .filter((edge) => byName[edge.source] && byName[edge.target])
          .slice(0, 80);
        const edgeMax = Math.max(1, ...edges.map((edge) => edge.value));
        const edgePaths = edges.map((edge) => {
          const a = nodePositions[nodes.findIndex((item) => item.id === edge.source)];
          const b = nodePositions[nodes.findIndex((item) => item.id === edge.target)];
          return `<path class="module-edge" d="M${a.x} ${a.y} L${b.x} ${b.y}"
            stroke-width="${Math.max(1, Math.min(6, Math.log2(edge.value + 1) / Math.log2(edgeMax + 1) * 6))}"
            marker-end="url(#arrow)"><title>${edge.source} → ${edge.target}: ${edge.value}</title></path>`;
        }).join("");
        const nodeMarks = nodes.map((item, index) => {
          const pos = nodePositions[index];
          const radius = 17 + Math.sqrt(item.value / maxValue) * 22;
          return `<g class="module-node" data-id="${item.id}" tabindex="0"
            transform="translate(${pos.x} ${pos.y})">
            <circle r="${radius}"></circle>
            <text class="module-label" y="4">${item.name}</text>
            <text class="module-label" y="18" font-size="10">${item.value}</text>
          </g>`;
        }).join("");
        container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img"
          aria-label="Module call graph">
          <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"></path>
          </marker></defs>
          ${edgePaths}
          ${nodeMarks}
        </svg>`;

        container.querySelectorAll(".module-node").forEach((node) => {
          node.addEventListener("click", () => {
            container.querySelectorAll(".module-node").forEach((item) => item.classList.remove("selected"));
            node.classList.add("selected");
            const id = node.dataset.id;
            const outgoing = data.module_edges.filter((edge) => edge.source === id);
            const incoming = data.module_edges.filter((edge) => edge.target === id);
            byId("overview-detail").textContent =
              `${id}: ${outgoing.length} outgoing modules, ${incoming.length} incoming modules`;
          });
          node.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              node.click();
            }
          });
        });
      }

      function renderCalls(filter = "") {
        const term = filter.trim().toLowerCase();
        const rows = term
          ? data.calls.filter((call) =>
              `${call.source} ${call.target} ${call.file} ${call.snippet}`.toLowerCase().includes(term)
            )
          : data.calls;
        byId("call-count").textContent = `${rows.length} / ${data.calls.length} calls`;
        byId("call-rows").innerHTML = rows.slice(0, 250).map((call) =>
          `<tr>
             <td>${call.source}</td>
             <td>${call.source_component}</td>
             <td>${call.target}</td>
             <td>${call.kind}</td>
             <td>${call.file}:${call.line}</td>
             <td class="code">${call.snippet}</td>
           </tr>`
        ).join("");
      }

      function renderFindings() {
        const resourceTags = Object.entries(data.resource_flow.types)
          .map(([name, value]) => `<span class="tag">${name} ${value}</span>`).join("");
        const syncTags = Object.entries(data.sync_relations.types)
          .map(([name, value]) => `<span class="tag">${name} ${value}</span>`).join("");
        const paths = data.key_chains.map((path) =>
          `<li>${path.summary || path.source || path.id}${path.termination_reason ? ` · ${path.termination_reason}` : ""}</li>`
        ).join("");
        byId("finding-grid").innerHTML =
          `<div class="finding-card"><h3>Resource Flow</h3>
             <div class="tag-row">${resourceTags || '<span class="tag">not available</span>'}</div>
           </div>
           <div class="finding-card"><h3>Sync Relations</h3>
             <div class="tag-row">${syncTags || '<span class="tag">not available</span>'}</div>
           </div>
           <div class="finding-card"><h3>Key Chains</h3>
             <ul class="path-list">${paths || "<li>None</li>"}</ul>
           </div>
           <div class="finding-card"><h3>Analysis</h3>
             <div class="module-meta">${data.summary || data.analysis.split("\n").slice(0, 2).join(" ")}</div>
           </div>`;
      }

      byId("call-filter").addEventListener("input", (event) => renderCalls(event.target.value));
      renderModules();
      renderModuleGraph();
      renderCalls();
      renderFindings();
    })();
  </script>
</body>
</html>
