name: Sandbox and observability
on:
  push:
    paths: ['clang_pipeline/**', 'scripts/accept_production_entry.py', 'requirements-jobs-s3.txt', 'deploy/**', '.dockerignore', '.github/workflows/sandbox.yml']
  pull_request:
    paths: ['clang_pipeline/**', 'scripts/accept_production_entry.py', 'requirements-jobs-s3.txt', 'deploy/**', '.dockerignore', '.github/workflows/sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and HTTP regression
        run: |
          python -m unittest clang_pipeline.tests.test_agent_jobs clang_pipeline.tests.test_durable_jobs clang_pipeline.tests.test_job_http clang_pipeline.tests.test_security clang_pipeline.tests.test_observability clang_pipeline.tests.test_ast_fallback clang_pipeline.tests.test_snapshot_identity -v
      - name: Build immutable sandbox image for real isolation tests
        run: |
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2
          docker pull debian:bookworm-slim
          BASE_IMAGE=$(docker image inspect debian:bookworm-slim --format '{{index .RepoDigests 0}}')
          docker build -f deploy/sandbox/Dockerfile --build-arg BASE_IMAGE="$BASE_IMAGE" -t localhost:5000/recode-sandbox:ci .
          docker push localhost:5000/recode-sandbox:ci
          SANDBOX_IMAGE=$(docker image inspect localhost:5000/recode-sandbox:ci --format '{{index .RepoDigests 0}}')
          echo "CRA_SANDBOX_TEST_IMAGE=$SANDBOX_IMAGE" >> "$GITHUB_ENV"
      - name: Verify real container boundary, quotas and full analysis
        run: python -m unittest clang_pipeline.tests.test_sandbox_integration -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Build pinned upstream MinIO source
        run: |
          mkdir "$RUNNER_TEMP/minio-source"
          curl --fail --location --retry 3 https://codeload.github.com/minio/minio/tar.gz/0d7408fc9969caf07de6a8c3a84f9fbb10a6739e -o "$RUNNER_TEMP/minio-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/minio-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/minio-source"
          cd "$RUNNER_TEMP/minio-source"
          go build -mod=readonly -p 2 -o "$RUNNER_TEMP/minio" .
      - name: Start real S3-compatible object store
        run: |
          pip install -r requirements-jobs-s3.txt
          python - <<'PY'
          import secrets
          import os
          import subprocess
          import boto3
          import time
          access, secret = secrets.token_hex(12), secrets.token_hex(24)
          print('::add-mask::' + access, flush=True)
          print('::add-mask::' + secret, flush=True)
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          with (temporary / 'minio.log').open('wb') as log:
              subprocess.Popen([str(temporary / 'minio'), 'server', '--address', '127.0.0.1:9000',
                                str(temporary / 'minio-data')],
                               env=dict(os.environ, MINIO_ROOT_USER=access, MINIO_ROOT_PASSWORD=secret),
                               stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
          client = boto3.client('s3', endpoint_url='http://127.0.0.1:9000',
                                aws_access_key_id=access, aws_secret_access_key=secret, region_name='us-east-1')
          for attempt in range(60):
              try:
                  client.create_bucket(Bucket='recode-acceptance')
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          print('::add-mask::' + access)
          print('::add-mask::' + secret)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AWS_ACCESS_KEY_ID={access}\nAWS_SECRET_ACCESS_KEY={secret}\nAWS_DEFAULT_REGION=us-east-1\n')
          PY
      - name: Accept default production HTTP entry with Docker and S3
        env:
          CRA_OBJECT_BACKEND: s3
          CRA_S3_ENDPOINT_URL: http://127.0.0.1:9000
          CRA_S3_BUCKET: recode-acceptance
          CRA_S3_PREFIX: production-entry
        run: python scripts/accept_production_entry.py --output "$RUNNER_TEMP/production-entry"
      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-entry-evidence
          path: |
            ${{ runner.temp }}/production-entry/evidence.json
            ${{ runner.temp }}/production-entry/*.log
            ${{ runner.temp }}/minio.log
          if-no-files-found: warn
      - name: Check no sandbox containers remain
        if: always()
        run: test -z "$(docker ps -q --filter label=recode.sandbox=true)"
